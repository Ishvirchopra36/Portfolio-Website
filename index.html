<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ishvir Chopra | The Base</title>
<meta name="description" content="Ishvir Chopra's portfolio: an explorable 3D hillside base. CS @ University of Waterloo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --purple:#7c3aed;--cyan:#06b6d4;--text:#f5f5ff;--muted:#a9a9c0;
  --panel:rgba(14,12,26,.9);--px:'Pixelify Sans',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a0a0f;color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
body.hovering #c{cursor:pointer}
body.dragging #c{cursor:grabbing}
a{color:inherit;text-decoration:none}
.pxbox{background:var(--panel);border:3px solid #000;box-shadow:inset 3px 3px 0 rgba(255,255,255,.13),inset -3px -3px 0 rgba(0,0,0,.5),0 5px 0 rgba(0,0,0,.35)}
.grad{background:linear-gradient(135deg,#a78bfa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  background:radial-gradient(ellipse at 30% 20%,rgba(124,58,237,.35),transparent 55%),radial-gradient(ellipse at 75% 85%,rgba(6,182,212,.25),transparent 55%),#0a0a0f;transition:opacity .5s}
#loader::before{content:"";position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:32px 32px}
#loader .inner{position:relative;text-align:center;width:min(540px,88vw)}
#loader .kick{font-family:var(--px);letter-spacing:.25em;color:var(--muted);font-size:.85rem}
#loader h1{font-family:var(--px);font-weight:700;font-size:clamp(2.8rem,9vw,5.2rem);line-height:1;margin:.5rem 0 .3rem;filter:drop-shadow(5px 5px 0 #000)}
#loader .sub{font-family:var(--px);color:var(--muted);margin-bottom:2rem;font-size:1.05rem}
.bar{height:28px;padding:4px;display:flex;gap:3px}
.bar i{flex:1;background:#1c1a2e;transition:background .15s}
.bar i.on{background:linear-gradient(#34e3ff,#7c3aed)}
#status{font-family:var(--px);margin-top:.7rem;color:var(--muted);font-size:1rem;min-height:1.3em}
.mcbtn{font-family:var(--px);font-size:1.3rem;color:#fff;padding:.85rem 2.4rem;background:linear-gradient(#8b5cf6,#5b21b6);border:3px solid #000;
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.28),inset -3px -3px 0 rgba(0,0,0,.4),0 5px 0 #000;cursor:pointer;transition:transform .12s,filter .12s}
.mcbtn:hover{transform:translateY(-2px);filter:brightness(1.18)}
.mcbtn:active{transform:translateY(2px)}
#enter{margin-top:1.8rem;opacity:0;pointer-events:none;transition:opacity .4s}
#enter.ready{opacity:1;pointer-events:auto;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.tip{margin-top:1.4rem;color:var(--muted);font-size:.85rem}
#dissolve{position:fixed;inset:0;z-index:55;display:grid;pointer-events:none}
#dissolve div{background:#0a0a0f;transition:opacity .35s steps(3)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;opacity:0;transition:opacity 1s .4s}
#hud.show{opacity:1}
.brand{position:absolute;top:16px;left:16px;padding:.55rem .9rem .6rem;pointer-events:auto;min-width:230px}
.brand b{font-family:var(--px);font-size:1.3rem;display:block;line-height:1.1}
.brand span{font-size:.78rem;color:var(--muted);font-family:var(--px)}
.brand span em{font-style:normal;color:#67e8f9}
.topright{position:absolute;top:16px;right:16px;display:flex;gap:8px;pointer-events:auto}
.iconbtn{min-width:44px;height:44px;display:inline-grid;place-items:center;color:#fff;font-size:1rem;cursor:pointer;border:3px solid #000;background:var(--panel);
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.13),inset -3px -3px 0 rgba(0,0,0,.5),0 4px 0 rgba(0,0,0,.35);transition:transform .12s,background .12s}
.iconbtn:hover{transform:translateY(-2px);background:#3b1f73}
.iconbtn.wide{padding:0 .9rem;font-family:var(--px);font-size:1rem}
#hotbar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;pointer-events:auto}
.slot{width:64px;height:64px;position:relative;display:grid;place-items:center;font-size:1.65rem;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.09);cursor:pointer;color:#fff;transition:background .15s}
.slot:hover{background:rgba(255,255,255,.12)}
.slot small{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-family:var(--px);font-size:.62rem;color:#ddd}
.slot kbd{position:absolute;top:1px;left:4px;font-family:var(--px);font-size:.62rem;color:#8a8aa0}
.slot.active{border:3px solid #fff;box-shadow:0 0 0 2px #000,0 0 18px rgba(34,211,238,.55);background:rgba(124,58,237,.25)}
#hint{position:absolute;bottom:104px;left:50%;transform:translateX(-50%);font-family:var(--px);padding:.45rem .9rem;transition:opacity .6s;white-space:nowrap}
#hint span{display:inline-block;animation:bob 1.2s ease-in-out infinite}
#hint.hide{opacity:0}
#tooltip{position:fixed;z-index:20;pointer-events:none;font-family:var(--px);font-size:1rem;padding:.35rem .65rem;background:rgba(18,4,38,.94);border:2px solid #000;outline:2px solid #5b21b6;outline-offset:-4px;color:#fff;opacity:0;transform:translate(16px,14px);white-space:nowrap}
#tooltip small{display:block;color:#a5f3fc;font-size:.75rem}
#toast{position:fixed;top:78px;left:50%;transform:translate(-50%,-10px);z-index:25;font-family:var(--px);padding:.5rem 1rem;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(5,4,14,.55);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .25s}
#modal.open{opacity:1;pointer-events:auto}
#modal .card{width:min(700px,93vw);max-height:86vh;overflow:auto;padding:1.7rem 1.8rem 1.6rem;position:relative;transform:translateY(18px) scale(.97);transition:transform .28s cubic-bezier(.2,1.4,.4,1);scrollbar-width:thin;scrollbar-color:#7c3aed transparent}
#modal.open .card{transform:none}
#modal .close{position:absolute;top:12px;right:12px}
.kicker{font-family:var(--px);color:#67e8f9;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase}
.card h2{font-family:var(--px);font-size:2rem;line-height:1.1;margin:.2rem 0 .6rem}
.card h3{font-family:var(--px);font-size:1.25rem}
.card h4{font-family:var(--px);font-size:1rem;color:var(--muted);margin:1.1rem 0 .5rem;font-weight:500}
.card p{color:#d8d8e8;line-height:1.65}
.card .muted{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:.7rem 0}
.tag{font-size:.76rem;padding:.25rem .55rem;background:rgba(124,58,237,.18);border:2px solid rgba(124,58,237,.55);color:#e4dcff}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:1.2rem}
.pxbtn{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--px);font-size:1rem;padding:.6rem 1.1rem;color:#fff;background:linear-gradient(#8b5cf6,#5b21b6);border:3px solid #000;box-shadow:inset 3px 3px 0 rgba(255,255,255,.25),inset -3px -3px 0 rgba(0,0,0,.4);transition:transform .12s,filter .12s;cursor:pointer}
.pxbtn:hover{transform:translateY(-2px);filter:brightness(1.15)}
.pxbtn.alt{background:linear-gradient(#22d3ee,#0e7490)}
.pxbtn.ghost{background:#1d1a30}
.about-top{display:grid;grid-template-columns:150px 1fr;gap:1.3rem;align-items:center}
.about-top img{width:150px;height:195px;object-fit:cover;border:3px solid #000;box-shadow:5px 5px 0 #7c3aed;image-rendering:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:1.1rem 0 .2rem}
.stat{padding:.7rem;text-align:center;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.08)}
.stat b{font-family:var(--px);font-size:1.7rem;display:block}
.stat span{font-size:.75rem;color:var(--muted)}
.socials{display:flex;gap:8px;flex-wrap:wrap;margin-top:1rem}
.job{padding:1rem 1.1rem;margin-top:.8rem;background:rgba(255,255,255,.035);border:2px solid rgba(255,255,255,.08);position:relative}
.job-top{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;flex-wrap:wrap}
.job .role{color:#c4b5fd;font-size:.9rem;margin:.1rem 0 .5rem}
.job .date{font-family:var(--px);font-size:.85rem;color:#67e8f9;white-space:nowrap}
.job ul{padding-left:1.1rem;color:#d0d0e2;font-size:.92rem;line-height:1.6}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.islot{padding:.55rem .4rem;font-size:.82rem;text-align:center;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);box-shadow:inset -2px -2px 0 rgba(0,0,0,.35);transition:transform .12s,border-color .12s}
.islot:hover{transform:translateY(-2px);border-color:#22d3ee}
.proj-head{display:flex;gap:1rem;align-items:center}
.proj-emoji{font-size:2.6rem;width:74px;height:74px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:3px solid #000;flex:none}
.pager{display:flex;justify-content:space-between;margin-top:1.4rem;padding-top:1rem;border-top:2px dashed rgba(255,255,255,.1)}
.edu{padding:1.1rem;background:rgba(255,255,255,.035);border:2px solid rgba(255,255,255,.08)}
.gpa{display:inline-block;font-family:var(--px);padding:.2rem .6rem;background:#22d3ee;color:#04232b;border:2px solid #000;margin:.4rem 0}
@media (max-width:680px){
  .slot{width:42px;height:42px;font-size:1.1rem}.slot small,.slot kbd{display:none}
  .brand{min-width:0}.brand span{display:none}.iconbtn.wide{display:none}
  .about-top{grid-template-columns:1fr}.about-top img{width:120px;height:150px}
  #hint{bottom:76px;font-size:.85rem}
}
.ico{width:1em;height:1em;vertical-align:-0.14em;flex:none;display:inline-block}
.artists{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:1rem}
.artist{padding:.8rem .9rem;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.08)}
.artist h3{font-size:1.05rem;margin-bottom:.45rem;color:#c4b5fd}
.track{display:flex;align-items:center;gap:.55rem;padding:.35rem .4rem;font-size:.9rem;color:#e4e4f2;border:2px solid transparent;transition:background .12s,border-color .12s}
.track:hover{background:rgba(34,211,238,.12);border-color:#22d3ee}
.track .ico{color:#22d3ee;font-size:.8rem}
.track{width:100%;text-align:left;background:none;font:inherit;line-height:1.35;cursor:pointer;border:2px solid transparent;color:inherit}
.track .eq{display:none;margin-left:auto;gap:2px;align-items:flex-end;height:12px}
.track.playing .eq{display:inline-flex}
.track .eq b{width:3px;background:currentColor;animation:eq .9s ease-in-out infinite}
.track .eq b:nth-child(2){animation-delay:-.3s}.track .eq b:nth-child(3){animation-delay:-.6s}
.track.playing{font-weight:700}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
#spDock{position:fixed;right:16px;bottom:100px;width:min(330px,calc(100vw - 32px));z-index:31;padding:8px;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .3s,transform .3s}
#spDock.show{opacity:1;transform:none;pointer-events:auto}
.sp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.78rem;margin:0 2px 6px;color:#ddd}
.sp-head span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sp-head button{background:none;border:0;color:#fff;cursor:pointer;font-size:.95rem;padding:2px 4px}
#spEmbed{min-height:80px;border-radius:12px;overflow:hidden}
@media (max-width:700px){#spDock{bottom:auto;top:70px}}
.sp-head span{font-family:var(--px)}
</style>
</head>

<div id="tooltip"></div>
<div id="toast" class="pxbox"></div>
<div id="modal"><div class="card pxbox"><button class="iconbtn close" id="closeBtn" aria-label="Close"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="modalBody"></div></div></div>

function canvasTex(w, h, draw, {pixel=true, repeat=false}={}){
  const c = document.createElement('canvas'); c.width = w; c.height = h;

/* =====================================================================
   VOXEL WORLD
   ===================================================================== */
const blocks = new Map();
const H = new Map();
const key = (x,y,z) => x + ',' + y + ',' + z;
const setB = (x,y,z,t) => blocks.set(key(x,y,z), t);
const delB = (x,y,z) => blocks.delete(key(x,y,z));
const hAt = (x,z) => H.get(x + ',' + z);

const inHouse = (x,z) => Math.abs(x) <= 8 && z >= -7 && z <= 6;
const isStair = (x,z) => Math.abs(x) <= 2 && z >= 7 && z <= 10;
const STAIR_H = {7:F, 8:F, 9:F-1, 10:F-2};
const inFarmL = (x,z) => x >= -14 && x <= -4 && z >= 14 && z <= 22;
const inFarmR = (x,z) => x >= 4 && x <= 14 && z >= 14 && z <= 22;
const inFarm = (x,z) => inFarmL(x,z) || inFarmR(x,z);
const isFarmBorder = (x,z) => !inFarm(x,z) && ((x >= -15 && x <= -3) || (x >= 3 && x <= 15)) && z >= 13 && z <= 23;
const isPath = (x,z) => (Math.abs(x) <= 1 && z >= 11) || (z >= 11 && z <= 12 && x >= 2 && x <= 11) || (x >= 8 && x <= 11 && z >= 9 && z <= 12);

function baseH(x, z){
  const d = Math.hypot(x, z*0.92) + (Math.sin(x*0.5) + Math.cos(z*0.45))*1.2;
  if (d > R) return null;
  const n = Math.sin(x*0.23+1.3)*Math.cos(z*0.19)*1.3 + Math.sin((x+z)*0.12) + Math.cos(x*0.07 - z*0.11)*1.4;
  let h;
  if (z >= 7){
    const side = Math.max(0, Math.abs(x) - 17);
    h = G + Math.max(0, Math.round(side*0.55 + n*0.5*(side>0?1:0)));
  } else {
    const rise = (7 - z)*1.5 + Math.max(0, Math.abs(x) - 11)*0.35;
    h = G + Math.max(0, Math.round(rise + n*1.6));
  }
  if (inHouse(x,z)) h = F;
  const edge = Math.floor((R - d)*0.95);
  h = Math.min(h, W + 1 + edge);
  return Math.min(h, G + 27);
}

function genTerrain(){
  for (let x = -R; x <= R; x++) for (let z = -R; z <= R; z++){
    let h = baseH(x, z);
    if (h === null) continue;
    if (isStair(x,z)) h = STAIR_H[z];
    H.set(x + ',' + z, h);
  }
  for (const [k, h] of H){
    const [x, z] = k.split(',').map(Number);
    let nb = Infinity;
    for (const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){ const v = hAt(x+dx, z+dz); nb = Math.min(nb, v === undefined ? -3 : v); }
    const from = Math.max(-3, Math.min(h, nb + 1) - 1);
    for (let y = from; y <= h; y++) setB(x, y, z, classify(x, y, z, h));
  }
}
function classify(x, y, z, h){
  const top = y === h;
  if (inHouse(x,z)) return top ? 'planks' : 'cobble';
  if (isStair(x,z)) return Math.abs(x) === 2 ? 'cobble' : (top ? 'planks' : 'cobble');
  if (h <= W + 1) return y > h - 3 ? 'sand' : 'stone';
  if (top){
    if (isPath(x,z)) return 'path';
    if (inFarm(x,z)) return 'farm';
    return 'grass';
  }
  if (y > h - 3) return 'dirt';
  return 'stone';
}

function buildHouse(){
  // walls
  for (let y = F+1; y <= F+9; y++) for (let x = -7; x <= 7; x++) for (let z = -6; z <= 6; z++){
    const per = Math.abs(x) === 7 || Math.abs(z) === 6;
    if (!per) continue;
    let t = 'planks';
    if (Math.abs(x) === 7 && Math.abs(z) === 6) t = 'log';
    else if (y === F+5 || y === F+9) t = 'log';
    else if (z === 6 && Math.abs(x) === 3) t = 'log';
    else if (y === F+1) t = 'cobble';
    setB(x, y, z, t);
  }
  // door opening
  for (let x = -1; x <= 1; x++) for (let y = F+1; y <= F+3; y++) delB(x, y, 6);
  // windows
  for (const x of [-5,-4,4,5]) for (const y of [F+2, F+3]) setB(x, y, 6, 'glass');
  for (const x of [-1,0,1]) for (const y of [F+7, F+8]) setB(x, y, 6, 'glassLit');
  for (const x of [-5,5]) for (const y of [F+7, F+8]) setB(x, y, 6, 'glassLit');
  // ceiling of ground floor
  for (let x = -6; x <= 6; x++) for (let z = -5; z <= 5; z++) setB(x, F+6, z, 'planks');
  // gable roof (ridge runs front→back)
  for (let k = 0; k <= 8; k++){
    const y = F + 10 + k, xr = 8 - k;
    for (let z = -7; z <= 7; z++){
      setB(xr, y, z, 'roof'); setB(-xr, y, z, 'roof');
      if (xr - 1 >= 0){ setB(xr-1, y, z, 'roof'); setB(-(xr-1), y, z, 'roof'); }
    }
    for (let x = -(xr-2); x <= xr-2; x++){ setB(x, y, 6, 'planks'); setB(x, y, -6, 'planks'); }
  }
  for (const y of [F+12, F+13]) setB(0, y, 6, 'glassLit');
  for (let k = 0; k <= 6; k++){ const y = F+10+k, xr = 6-k; if (xr >= 2){ setB(xr, y, 6, 'log'); setB(-xr, y, 6, 'log'); } } // gable trim
  // awning over door
  for (let x = -2; x <= 2; x++) setB(x, F+4, 7, 'roof');
  // chimney
  for (let y = F+6; y <= F+17; y++) setB(5, y, -4, 'cobble');
  // bookshelves
  for (const x of [-6,-5,5,6]) for (const y of [F+1, F+2]) setB(x, y, -5, 'bookshelf');
  // farm borders + portal frame
  for (const [k] of H){
    const [x, z] = k.split(',').map(Number);
    if (isFarmBorder(x,z) && !isPath(x,z)) setB(x, G+1, z, 'cobble');
  }
  for (let x = 8; x <= 11; x++) for (let y = G+1; y <= G+5; y++){
    if (x === 8 || x === 11 || y === G+1 || y === G+5) setB(x, y, 8, 'obsidian');
  }
}

const decorPlants = {wheat:[], tallGrass:[], flowerRed:[], flowerWhite:[], flowerBlue:[]};
function tree(x, z, big){
  const h = hAt(x, z);
  if (h === undefined || h <= W+1) return;
  if (blocks.get(key(x,h,z)) !== 'grass') return;
  const trunk = (big ? 6 : 4) + (hash(x*3+z) < 0.5 ? 1 : 0);
  const leaf = hash(x+z*7) < 0.4 ? 'leavesDark' : 'leaves';
  for (let y = h+1; y <= h+trunk; y++) setB(x, y, z, 'log');
  const cy = h + trunk, r = big ? 3 : 2;
  for (let dx = -r; dx <= r; dx++) for (let dy = -2; dy <= 2; dy++) for (let dz = -r; dz <= r; dz++){
    const d = Math.sqrt(dx*dx + dy*dy*2.2 + dz*dz);
    if (d > r + 0.4) continue;
    if (d > r - 0.6 && hash(dx*13 + dy*7 + dz*3 + x*31 + z) < 0.35) continue;
    const k = key(x+dx, cy+dy, z+dz);
    if (!blocks.has(k)) blocks.set(k, leaf);
  }
  setB(x, cy+3, z, leaf);
}
function decorate(){
  [[-18,4,1],[-23,-5,1],[-13,-13,1],[16,-7,1],[22,3,1],[12,-17,0],[-3,-19,1],[6,-25,1],[-20,-18,0],[24,-13,1],[-26,12,0],[26,12,0],[-9,-27,0],[18,-24,1],[-28,-2,0],[29,-4,0],[-14,-3,0],[-24,26,0],[24,25,0]]
    .forEach(([x,z,b]) => tree(x, z, !!b));
  for (const [k, h] of H){
    const [x, z] = k.split(',').map(Number);
    if (inFarm(x,z)) { decorPlants.wheat.push([x, h+0.5+0.47, z]); continue; }
    if (blocks.get(key(x,h,z)) !== 'grass' || blocks.has(key(x,h+1,z))) continue;
    if (isPath(x,z) || isFarmBorder(x,z) || inHouse(x,z) || isStair(x,z)) continue;
    const r = hash(x*91.7 + z*13.1);
    const near = z < 7 ? 1 : 0.6;
    if (r < 0.16*near) decorPlants.tallGrass.push([x, h+0.5+0.4, z]);
    else if (r < 0.2*near) decorPlants.flowerWhite.push([x, h+0.5+0.4, z]);
    else if (r < 0.23*near) decorPlants.flowerRed.push([x, h+0.5+0.4, z]);
    else if (r < 0.245*near) decorPlants.flowerBlue.push([x, h+0.5+0.4, z]);
  }
}

const OPAQUE = t => t !== 'glass' && t !== 'glassLit';
const boxGeo = new THREE.BoxGeometry(1,1,1);
const OCCLUDERS = ['planks','log','cobble','roof','glassLit','bookshelf'];
const occluders = [];
function meshBlocks(){
  const groups = {};
  for (const [k, t] of blocks){
    const [x, y, z] = k.split(',').map(Number);
    let hidden = true;
    for (const [dx,dy,dz] of DIRS){ const n = blocks.get(key(x+dx, y+dy, z+dz)); if (!n || !OPAQUE(n) || n.startsWith('leaves') !== t.startsWith('leaves')){ hidden = false; break; } }
    if (hidden) continue;
    (groups[t] ??= []).push(x, y, z);
  }
  const m4 = new THREE.Matrix4();
  for (const t in groups){
    const a = groups[t], n = a.length/3;
    const im = new THREE.InstancedMesh(boxGeo, M[t], n);
    for (let i = 0; i < n; i++){ m4.makeTranslation(a[i*3], a[i*3+1], a[i*3+2]); im.setMatrixAt(i, m4); }
    im.castShadow = t !== 'glass'; im.receiveShadow = true;
    im.frustumCulled = false;
    if (OCCLUDERS.includes(t)) occluders.push(im);
    scene.add(im);
  }
  // crossed-plane plants (wheat sways)
  const p1 = new THREE.PlaneGeometry(0.95, 0.95), p2 = p1.clone().rotateY(Math.PI/2);
  const cross = mergeGeometries([p1.clone().rotateY(Math.PI/4), p2.rotateY(Math.PI/4)]);
  for (const kind in decorPlants){
    const list = decorPlants[kind]; if (!list.length) continue;
    const mat = new THREE.MeshLambertMaterial({map:T[kind], alphaTest:0.5, side:THREE.DoubleSide});
    mat.onBeforeCompile = sh => {
      sh.uniforms.uTime = swayUniform;
      sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>',
        `#include <begin_vertex>
         vec4 ip = instanceMatrix * vec4(0.,0.,0.,1.);
         float sw = sin(uTime*1.7 + ip.x*0.55 + ip.z*0.35) * ${kind === 'wheat' ? '0.12' : '0.06'} * (position.y + 0.5);
         transformed.x += sw; transformed.z += sw*0.6;`);
    };
    const im = new THREE.InstancedMesh(cross, mat, list.length);
    list.forEach(([x,y,z], i) => { m4.makeRotationY(hash(x*3.1+z) * 3); m4.setPosition(x + (hash(x+z*5)-0.5)*0.2, y, z + (hash(z+x*5)-0.5)*0.2); im.setMatrixAt(i, m4); });
    im.receiveShadow = true; im.frustumCulled = false;
    scene.add(im);
  }
}

const interactives = [], pickables = [];
function makeInteractive(obj, info){
  info.obj = obj; info.mats = []; info.glow = 0; info.pos = new THREE.Vector3();
  obj.traverse(o => {
    if (!o.isMesh) return;
    if (!o.material.isShaderMaterial){ o.castShadow = true; o.receiveShadow = true; }
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
      if (m.emissive && !info.mats.includes(m)){
        if (m.map){ m.emissive.set(0xffffff); m.emissiveMap = m.map; } else m.emissive.copy(m.color);
        m.userData.baseEI = m.emissiveIntensity = m.userData.baseEI ?? 0; info.mats.push(m);
      }
    });
    o.userData.inter = info; pickables.push(o);
  });
  obj.updateMatrixWorld(true);
  new THREE.Box3().setFromObject(obj).getCenter(info.pos);
  interactives.push(info);
  return info;
}
function pixelIcon(name, size=24){
  const s = document.createElement('canvas'); s.width = s.height = size;
  const img = ICON_IMG[name + '#ffffff' + 2.6]; if (img) s.getContext('2d').drawImage(img, 0, 0, size, size);
  return s;
}
function fitText(g, text, max, size, weight=700){
  let fs = size; g.font = `${weight} ${fs}px "Pixelify Sans", monospace`;
  while (g.measureText(text).width > max && fs > 10){ fs -= 1; g.font = `${weight} ${fs}px "Pixelify Sans", monospace`; }
}
function frameTexture(p){
  return canvasTex(256, 256, g => {
    for (let y = 0; y < 256; y += 16) for (let x = 0; x < 256; x += 16){ g.fillStyle = col('#6b4423', 0.8 + rng()*0.35); g.fillRect(x, y, 16, 16); }

    g.fillStyle = p.bg; g.fillRect(22, 22, 212, 212);
    for (let y = 22; y < 234; y += 8) for (let x = 22; x < 234; x += 8) if (((x+y)/8) % 2 === 0){ g.fillStyle = 'rgba(255,255,255,0.035)'; g.fillRect(x, y, 8, 8); }
    g.imageSmoothingEnabled = false;
    g.drawImage(pixelIcon(p.icon, 24), 70, 34, 116, 116);
    g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(22, 168, 212, 66);
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
    fitText(g, p.title, 196, 30); g.fillText(p.title, 128, 192);

   ===================================================================== */
const clock = new THREE.Clock();
let lastSlot = '', frame = 0;
const doorPos = new THREE.Vector3(0, F + 2, 6.3);
const camDir = new THREE.Vector3();
function loop(){
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  frame++;
  if (started && intro > 0) intro = Math.max(0, intro - dt/3.2);
  updateCamera(dt, time);
  swayUniform.value = time;

  // night blend
  night = damp(night, nightT, 2, dt);
  sky.material.uniforms.top.value.lerpColors(SKY.day.top, SKY.night.top, night);
  sky.material.uniforms.bottom.value.lerpColors(SKY.day.bottom, SKY.night.bottom, night);
  scene.fog.color.lerpColors(SKY.day.fog, SKY.night.fog, night);
  sun.intensity = lerp(2.6, 0.35, night); sun.color.setRGB(lerp(1, 0.55, night), lerp(0.94, 0.65, night), lerp(0.85, 1, night));
  hemi.intensity = lerp(1.25, 0.32, night);
  stars.material.opacity = night;
  fireflies.material.opacity = night*0.95;
  M.glassLit.emissiveIntensity = lerp(0.25, 1.4, night);
  warmLights.forEach(l => { const flick = 1 + Math.sin(time*9 + l.position.x)*0.04; l.intensity = l.userData.base*(l.userData.portal ? 1 + Math.sin(time*2)*0.2 : lerp(0.55, 2.2, night))*flick; });

  // doors open on proximity
  const near = camera.position.distanceTo(doorPos) < 6.2 && intro === 0;
  doors.forEach(d => {
    const was = d.userData.open > 0.5;
    d.userData.open = damp(d.userData.open, near ? 1 : 0, 5, dt);
    d.rotation.y = d.userData.dir * d.userData.open * 1.75;
    if ((d.userData.open > 0.5) !== was && d === doors[0]) Sound.door();
  });
  // chest lid
  if (chest){ const u = chest.userData; u.open = damp(u.open, u.target, 8, dt); u.lid.rotation.x = -u.open*1.2; }
  // portal
  portalMat.uniforms.uTime.value = time;
  { const a = portalParticles.geometry.attributes.position, b = portalParticles.geometry.userData.base;
    for (let i = 0; i < a.count; i++){ a.setY(i, b[i*3+1] + ((time*0.5 + i*0.37) % 1.2)); a.setX(i, b[i*3] + Math.sin(time*2 + i)*0.1); }
    a.needsUpdate = true; }
  // fireflies
  if (night > 0.02){ const a = fireflies.geometry.attributes.position, b = fireflies.geometry.userData.base;
    for (let i = 0; i < a.count; i++){ a.setXYZ(i, b[i*3] + Math.sin(time*0.6 + i)*0.8, b[i*3+1] + Math.sin(time*0.9 + i*1.7)*0.5, b[i*3+2] + Math.cos(time*0.5 + i*2.1)*0.8); }
    a.needsUpdate = true; }
  // clouds
  clouds.forEach(c => { c.position.x += c.userData.speed*dt; if (c.position.x > 160) c.position.x = -160; });
  // chimney smoke
  smoke.forEach(s => { s.userData.life = (s.userData.life + dt*0.16) % 1; const l = s.userData.life;
    s.position.set(5 + Math.sin(l*6 + s.id)*0.4 + l*2, F + 18 + l*7, -4 + l*0.8); s.scale.setScalar(0.6 + l*1.8); s.material.opacity = (1 - l)*0.7*(1 - night*0.5); });
  if (lecternBook) lecternBook.material.userData.baseEI = 0.15 + Math.sin(time*2)*0.08 + night*0.3;

  // hover + glow
  if (!modalOpen && !down && mouse.px >= 0 && !isTouch && started && frame % 2 === 0) setHover(pick(mouse.px, mouse.py));
  camera.getWorldDirection(camDir);
  for (const info of interactives){
    tmpV.copy(info.pos).sub(camera.position); const dist = tmpV.length(); tmpV.normalize();
    const nearIt = dist < 11 && tmpV.dot(camDir) > 0.55;
    const target = info === hovered ? 0.6 : nearIt ? 0.2 + 0.18*Math.sin(time*4.5) : 0;
    info.glow = damp(info.glow, target, 10, dt);
    info.mats.forEach(m => m.emissiveIntensity = (m.userData.baseEI || 0) + info.glow);
    info.onGlow?.(info.glow);
  }

  // hotbar highlight
  const s = currentSlot();
  if (s !== lastSlot){ Object.entries(slotEls).forEach(([k, v]) => v.el.classList.toggle('active', k === s)); lastSlot = s; }

  renderer.render(scene, camera);
}

  setProgress(0.76, 'Meshing chunks…'); await nextFrame(); meshBlocks();
  setProgress(0.88, 'Lighting lanterns…'); await nextFrame(); await Promise.all(DATA.projects.map(p => loadIcon(p.icon, '#ffffff', 2.6))); buildSky(); buildProps();
  updateCamera(0.016, 0);
  renderer.compile(scene, camera);
  renderer.setAnimationLoop(loop);
  setProgress(1, 'World ready.');
  $('#enter').classList.add('ready');
}
$('#enter').addEventListener('click', () => {
  if (!$('#enter').classList.contains('ready') || started) return;
  Sound.init(); Sound.click();
  const dis = $('#dissolve'); const cols = 16, rows = 9;
  dis.style.gridTemplateColumns = `repeat(${cols},1fr)`; dis.style.gridTemplateRows = `repeat(${rows},1fr)`;
  for (let i = 0; i < cols*rows; i++){ const d = document.createElement('div'); d.style.transitionDelay = (Math.random()*0.9).toFixed(2) + 's'; dis.appendChild(d); }
  $('#loader').style.opacity = 0;
  setTimeout(() => { $('#loader').style.display = 'none'; }, 500);
  requestAnimationFrame(() => requestAnimationFrame(() => [...dis.children].forEach(d => d.style.opacity = 0)));
  setTimeout(() => dis.remove(), 1600);
  started = true;
  $('#hud').classList.add('show');
  canvas.focus();
  setTimeout(() => { if (!hintHidden) $('#hint').classList.remove('hide'); }, 1500);
});
build().catch(err => { console.error(err); setProgress(0, 'Something broke: ' + err.message); });
</script>
